<div class="mb-3">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="form-check">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {% for e in field.errors %}<div class="invalid-feedback d-block"><i class="bi bi-exclamation-circle-fill me-1"></i>{{ e }}</div>{% endfor %}
    </div>
  {% else %}
    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ field }}
    {% for e in field.errors %}<div class="invalid-feedback d-block"><i class="bi bi-exclamation-circle-fill me-1"></i>{{ e }}</div>{% endfor %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% endif %}
</div>
