<div class="col">
  <article class="ta-card h-100 d-flex flex-column">
    <img src="{{ curso.imagen_url }}" alt="{{ curso.nombre }}" loading="lazy" class="w-100">
    <div class="p-3 d-flex flex-column flex-grow-1">
      <div class="d-flex gap-2 mb-2 flex-wrap">
        <span class="ta-chip {{ curso.nivel }}"><i class="bi bi-bar-chart-steps"></i>{{ curso.get_nivel_display }}</span>
        <span class="ta-chip">{% if curso.modalidad == 'virtual' %}<i class="bi bi-laptop"></i>{% else %}<i class="bi bi-shop"></i>{% endif %}{{ curso.get_modalidad_display }}</span>
      </div>
      <h3 class="h5 mb-1">{{ curso.nombre }}</h3>
      <p class="small text-secondary mb-2"><i class="bi bi-tag me-1"></i>{{ curso.categoria }}</p>
      <p class="small flex-grow-1">{{ curso.descripcion|truncatewords:16 }}</p>
      <div class="d-flex justify-content-between align-items-center">
        <strong class="fs-5">S/ {{ curso.precio|floatformat:0 }}</strong>
        <a href="{{ curso.get_absolute_url }}" class="btn btn-sm btn-outline-ta">Ver curso <i class="bi bi-arrow-right"></i></a>
      </div>
    </div>
  </article>
</div>
